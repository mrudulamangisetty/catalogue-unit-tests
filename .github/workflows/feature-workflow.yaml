name: feature-workflow
on: [push]
  # workflow_dispatch button usually appears only when the
  # workflow exists in the repository’s default branch (often main or master) on GitHub
jobs:
  feature-pipeline:
    #if: github.ref_name == 'feature*' it literally comprares the same value
    if: startsWith(github.ref_name, 'feature-')
    uses: github/mrudulamang/workflows/.github/workflows/nodejs-feature-pipeline.git@main
    with:
      project: 'roboshop'
      component: 'catalogue'
      environment: 'dev'
